<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vpn</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PWA Manifest beállítások a PWABuilder-hez -->
    <link rel="manifest" href="data:application/manifest+json,{
        %22name%22:%22Vpn%22,
        %22short_name%22:%22Vpn%22,
        %22start_url%22:%22/%22,
        %22display%22:%22standalone%22,
        %22background_color%22:%22%23030712%22,
        %22theme_color%22:%22%23dc2626%22,
        %22icons%22:[{%22src%22:%22https://via.placeholder.com/512/dc2626/ffffff?text=VPN%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]
    }">
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-gray-900 border border-red-900/40 w-full max-w-md rounded-3xl shadow-2xl p-6 md:p-8 flex flex-col items-center">
        <!-- Logó / Cím -->
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center shadow-lg shadow-red-600/30 mb-3 text-2xl font-black tracking-wider">
            VPN
        </div>
        <h1 class="text-xl font-bold tracking-wide text-gray-100 mb-1">Vpn</h1>
        <p id="statusText" class="text-xs text-red-400 font-medium mb-8">Állapot: Nem csatlakozik</p>

        <!-- Fő csatlakozás gomb -->
        <button id="connectBtn" onclick="toggleConnection()" class="w-36 h-36 rounded-full border-4 border-red-600/40 bg-gradient-to-b from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 shadow-xl shadow-red-600/40 flex flex-col items-center justify-center transition-all duration-300 transform active:scale-95 mb-8 group">
            <svg id="powerIcon" class="w-12 h-12 text-white mb-1 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9"></path>
            </svg>
            <span id="btnText" class="text-sm font-bold uppercase tracking-wider">Kapcsolódás</span>
        </button>

        <!-- Kontinens / Szerver választó -->
        <div class="w-full">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Válassz kontinensen szervert:</label>
            <select id="serverSelect" class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 transition">
                <option value="Európa">🌍 Európa (Frankfurt - Leggyorsabb)</option>
                <option value="Észak-Amerika">🌎 Észak-Amerika (New York)</option>
                <option value="Ázsia">🌏 Ázsia (Tokió)</option>
                <option value="Dél-Amerika">🌎 Dél-Amerika (São Paulo)</option>
                <option value="Ausztrália">🌍 Ausztrália (Sydney)</option>
                <option value="Afrika">🌍 Afrika (Johannesburg)</option>
            </select>
        </div>

        <!-- Adatforgalom infó -->
        <div class="w-full grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-gray-800 text-center text-xs text-gray-400">
            <div>
                <p class="text-gray-500 uppercase">Letöltés</p>
                <p id="downloadSpeed" class="text-gray-200 font-bold text-sm mt-0.5">0 KB/s</p>
            </div>
            <div>
                <p class="text-gray-500 uppercase">Feltöltés</p>
                <p id="uploadSpeed" class="text-gray-200 font-bold text-sm mt-0.5">0 KB/s</p>
            </div>
        </div>
    </div>

    <script>
        let isConnected = false;

        function toggleConnection() {
            const btn = document.getElementById('connectBtn');
            const statusText = document.getElementById('statusText');
            const btnText = document.getElementById('btnText');
            const down = document.getElementById('downloadSpeed');
            const up = document.getElementById('uploadSpeed');
            const select = document.getElementById('serverSelect');

            isConnected = !isConnected;

            if (isConnected) {
                btn.classList.remove('border-red-600/40', 'from-red-600', 'to-red-700');
                btn.classList.add('border-emerald-500/60', 'from-emerald-600', 'to-emerald-700', 'shadow-emerald-600/40');
                statusText.innerText = `Állapot: Csatlakozva (${select.value})`;
                statusText.classList.remove('text-red-400');
                statusText.classList.add('text-emerald-400');
                btnText.innerText = 'Lekapcsol';
                down.innerText = Math.floor(Math.random() * 40 + 60) + ' MB/s';
                up.innerText = Math.floor(Math.random() * 15 + 10) + ' MB/s';
            } else {
                btn.classList.add('border-red-600/40', 'from-red-600', 'to-red-700');
                btn.classList.remove('border-emerald-500/60', 'from-emerald-600', 'to-emerald-700', 'shadow-emerald-600/40');
                statusText.innerText = 'Állapot: Nem csatlakozik';
                statusText.classList.add('text-red-400');
                statusText.classList.remove('text-emerald-400');
                btnText.innerText = 'Kapcsolódás';
                down.innerText = '0 KB/s';
                up.innerText = '0 KB/s';
            }
        }
    </script>
</body>
</html>
